name: Visual Studio 2026 client CI

on:
  push:
    branches: [main]
    paths:
      - 'src/vs2026/**'
      - '.github/workflows/vs2026.yml'
  pull_request:
    paths:
      - 'src/vs2026/**'
      - '.github/workflows/vs2026.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: src/vs2026

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          # Project targets net10.0-windows; keep this in sync with TargetFramework
          # in PipelinesExplorer.VisualStudio.csproj.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PipelinesExplorer.VisualStudio.csproj

      - name: Build (Release)
        run: dotnet build PipelinesExplorer.VisualStudio.csproj -c Release --no-restore

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: pipelines-explorer-vs2026-vsix
          path: src/vs2026/bin/Release/**/*.vsix
          if-no-files-found: warn
