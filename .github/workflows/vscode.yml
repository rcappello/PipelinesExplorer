name: VS Code client CI

on:
  push:
    branches: [main]
    paths:
      - 'src/vscode/**'
      - '.github/workflows/vscode.yml'
  pull_request:
    paths:
      - 'src/vscode/**'
      - '.github/workflows/vscode.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: src/vscode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/vscode/package-lock.json

      - run: npm ci
      - run: npm run package
      - run: npx @vscode/vsce package --out pipelines-explorer.vsix

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pipelines-explorer-vsix
          path: src/vscode/pipelines-explorer.vsix
