name: Release VSIX (VS Code)

on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: src/vscode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/vscode/package-lock.json

      - run: npm ci
      - run: npm run package
      - run: npx @vscode/vsce package --out pipelines-explorer.vsix

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipelines-explorer-vsix
          path: src/vscode/pipelines-explorer.vsix

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/vscode/pipelines-explorer.vsix
          generate_release_notes: true

      # ----------------------------------------------------------------------
      # When you are ready to publish to the public Marketplace:
      # 1. make the GitHub repo public
      # 2. add a repo secret VSCE_PAT (Azure DevOps PAT, scope: Marketplace > Manage)
      # 3. uncomment the step below
      # ----------------------------------------------------------------------
      # - name: Publish to VS Code Marketplace
      #   if: startsWith(github.ref, 'refs/tags/vscode-v')
      #   run: npx @vscode/vsce publish --packagePath pipelines-explorer.vsix
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
