name: Release VSIX (VS Code)

on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VSIX & attach to GitHub Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/vscode/package-lock.json

      - run: npm ci

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        shell: bash
        run: |
          # Strip the 'vscode-v' prefix to get a SemVer (e.g. vscode-v1.2.3 -> 1.2.3).
          VERSION="${GITHUB_REF_NAME#vscode-v}"
          echo "Setting package.json version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm run package
      - run: npx @vscode/vsce package --out pipelines-explorer.vsix

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: pipelines-explorer-vsix
          path: src/vscode/pipelines-explorer.vsix

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/vscode/pipelines-explorer.vsix
          generate_release_notes: true

  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: build
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    # The 'marketplace' environment scopes the VSCE_PAT secret. No reviewer
    # gate (intentional — single-maintainer private repo, tag push is the gate).
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=RiccardoCappello.vscode-pipelinesexplorer
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download VSIX artifact
        uses: actions/download-artifact@v5
        with:
          name: pipelines-explorer-vsix
          path: artifact

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath artifact/pipelines-explorer.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

